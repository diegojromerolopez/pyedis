name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install Dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make install
      - name: Run Tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make test
      - name: Run Containerized E2E
        run: |
          make e2e
