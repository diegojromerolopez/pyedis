name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: make install

      - name: Run linter and type checking
        run: make lint

      - name: Run unit and integration tests
        run: make test

      - name: Run E2E tests
        run: make e2e
