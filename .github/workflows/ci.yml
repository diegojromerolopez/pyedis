name: CI

on:
  push:
    branches: [ main, 'feat/**', 'noctifab/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit, Lint & E2E Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
          pip install ruff mypy redis coverage

      - name: Run Linters & Type Checking
        run: |
          if grep -q "^lint:" Makefile 2>/dev/null; then
            make lint
          elif [ -d "src" ]; then
            ruff check src tests
            mypy --strict src
          fi

      - name: Run Unit & Integration Tests
        run: |
          if grep -q "^test:" Makefile 2>/dev/null; then
            make test
          elif [ -d "tests" ]; then
            python3 -m unittest discover -s tests -v
          fi

      - name: Run E2E Black-Box Harness
        run: |
          if [ -f "docker-compose.e2e.yml" ]; then
            docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from test-runner-e2e
          elif [ -f "src/main.py" ] && [ -f "tests/e2e/run_tests.sh" ]; then
            chmod +x tests/e2e/run_tests.sh
            python3 -m src.main &
            SERVER_PID=$!
            sleep 2
            ./tests/e2e/run_tests.sh
            kill $SERVER_PID
          fi
