[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyedis"
version = "0.1.0"
description = "Native Redis RESP Key-Value Store in Python 3.14"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "redis>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "coverage>=7.6"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
