services:
  api:
    build: .
    command: ["python3", "-m", "src.main"]
    environment:
      PORT: "6379"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 6379), 1); s.sendall(b'*1\\r\\n$4\\r\\nPING\\r\\n'); r=s.recv(16); s.close(); raise SystemExit(0 if r.startswith(b'+PONG') else 1)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
  e2e:
    image: python:3.12-slim
    depends_on:
      api:
        condition: service_healthy
    environment:
      PYEDIS_HOST: api
      PYEDIS_PORT: "6379"
    volumes:
      - ./tests/e2e/run.py:/run.py:ro
    command: ["python3", "/run.py"]
