services:
  pyedis-server:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      - PORT=6379
      - PYEDIS_DATA_DIR=/tmp/pyedis_data
    command: python3 -m src.main
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5

  test-runner-e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      - REDIS_HOST=pyedis-server
      - REDIS_PORT=6379
    depends_on:
      pyedis-server:
        condition: service_healthy
    command: bash tests/e2e/run_tests.sh
