version: '3.8'
services:
  pyedis-server:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: python -m src.main
    environment:
      - PORT=6379
      - PYEDIS_DATA_DIR=/tmp/pyedis_data
      - PYEDIS_AOF_FSYNC=false
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 10

  test-runner-e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      - REDIS_HOST=pyedis-server
      - REDIS_PORT=6379
    depends_on:
      pyedis-server:
        condition: service_healthy
    command: bash tests/e2e/run_tests.sh
